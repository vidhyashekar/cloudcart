services:

  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:16-alpine
    container_name: cloudcart-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudcart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloudcart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudcart"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: cloudcart-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    networks:
      - cloudcart-network
  
  # =========================
  # Auth Service
  # =========================
  auth-service:
    image: cloudcart-auth-service
    container_name: cloudcart-auth-service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cloudcart

      JWT_SECRET: cloudcart-development-secret
      JWT_EXPIRATION: 24h

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cloudcart-network

  
  # =========================
  # Product Service
  # =========================
  product-service:
    image: cloudcart-product-service
    container_name: cloudcart-product-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cloudcart

      JWT_SECRET: cloudcart-development-secret

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cloudcart-network

  # =========================
  # Order Service
  # =========================
  order-service:
    image: cloudcart-order-service
    container_name: cloudcart-order-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cloudcart

      JWT_SECRET: cloudcart-development-secret

      PRODUCT_SERVICE_URL: http://product-service:8081

      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: order-events

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      product-service:
        condition: service_started

    networks:
      - cloudcart-network

 
  # =========================
  # Notification Service
  # =========================
  notification-service:
    image: cloudcart-notification-service
    container_name: cloudcart-notification-service
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: order-events
      KAFKA_GROUP_ID: notification-service

    depends_on:
      kafka:
        condition: service_started

    networks:
      - cloudcart-network

# =========================
# Volumes
# =========================
volumes:
  postgres_data:

# =========================
# Network
# =========================
networks:
  cloudcart-network:
    driver: bridge