apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cloudcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: cloudcart-notification-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cloudcart-config
          env:
            - name: KAFKA_GROUP_ID
              value: "notification-service"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
