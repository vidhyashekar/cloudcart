
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cloudcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: notification-service
          image: cloudcart-notification-service:v2
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: cloudcart-config

          env:
            - name: KAFKA_GROUP_ID
              value: "notification-service"

          ports:
            - containerPort: 8083
              name: http
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
